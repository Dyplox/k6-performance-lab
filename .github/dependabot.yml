# Actualizaciones automáticas de dependencias: cada lunes abre PRs que el smoke valida.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      lint-y-tipos:
        patterns: ['*']
    ignore:
      # typescript-eslint declara soporte hasta una versión concreta de TypeScript (peer
      # dependency): un major nuevo rompe `npm ci` hasta que typescript-eslint lo soporte.
      # Se actualiza a mano cuando ambos sean compatibles.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Los tipos de Node deben seguir la versión de Node de CI (24), no la última publicada.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # Imágenes de docker-compose.yml (Restful Booker por digest, Prometheus, Grafana, cAdvisor, k6).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
