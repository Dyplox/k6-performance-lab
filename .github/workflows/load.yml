name: Carga programada

# Prueba de carga semanal (y manual) contra el SUT en Docker:
#   1. thresholds de SLO (k6 sale con 99 si se incumplen)
#   2. comparación con baselines/load.json para detectar regresiones de latencia
#   3. reporte HTML como artefacto y, en main, publicado en GitHub Pages
# Una vez por semana basta para un repo de portafolio y no consume minutos de más
# (en repos públicos los runners estándar de GitHub Actions son gratuitos).
on:
  schedule:
    # Lunes 09:17 UTC (04:17 en Colombia). Minuto no redondo: a las :00 hay cola en los runners.
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      time_scale:
        description: 'TIME_SCALE: multiplica la duración (1 ≈ 2 min). Con otro valor no se compara con la línea base.'
        default: '1'
      load_scale:
        description: 'LOAD_SCALE: multiplica la tasa (1 = 10 iteraciones/s)'
        default: '1'

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

env:
  K6_VERSION: 2.4.0
  K6_NO_USAGE_REPORT: 'true'

jobs:
  carga:
    name: Carga con SLOs y línea base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Levantar Restful Booker (espera al healthcheck)
        run: docker compose up -d --wait restful-booker

      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: ${{ env.K6_VERSION }}

      # Los inputs se pasan como variables de entorno (k6 las lee con __ENV), nunca interpolados
      # dentro del script de shell: así un valor malicioso no se ejecuta como comando.
      - name: Carga
        id: k6
        continue-on-error: true
        run: k6 run src/tests/load.ts
        env:
          TEST_ID: load-${{ github.run_id }}
          TIME_SCALE: ${{ inputs.time_scale || '1' }}
          LOAD_SCALE: ${{ inputs.load_scale || '1' }}

      - name: Resumen en la pestaña Summary
        if: always()
        run: cat reports/load-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "k6 no generó resumen" >> "$GITHUB_STEP_SUMMARY"

      - name: Comparar con la línea base
        id: baseline
        continue-on-error: true
        run: node scripts/compare-baseline.ts --type load

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-report
          path: reports/
          retention-days: 30

      - name: Logs del SUT
        if: steps.k6.outcome == 'failure'
        run: docker compose logs --tail 200 restful-booker

      - name: Apagar el SUT
        if: always()
        run: docker compose down

      # Los dos pasos anteriores usan continue-on-error para que siempre se suban los reportes;
      # aquí se decide el resultado del job.
      - name: Resultado
        if: steps.k6.outcome == 'failure' || steps.baseline.outcome == 'failure'
        run: |
          echo "::error::SLOs incumplidos (k6: ${{ steps.k6.outcome }}) o regresión contra la línea base (${{ steps.baseline.outcome }})"
          exit 1

  # Publica el último reporte de carga de main en GitHub Pages (también si falló: así se ve el porqué).
  # Requiere activar una vez: Settings → Pages → Source: "GitHub Actions".
  reporte:
    name: Publicar reporte en GitHub Pages
    needs: carga
    if: always() && needs.carga.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-report
          path: reporte

      - name: Preparar sitio
        run: |
          mkdir -p sitio
          cp reporte/load-report.html sitio/index.html
          cp reporte/load-summary.json sitio/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
